name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Synthetic, local-only tests. Never add production Supabase keys to this workflow.
permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Core product rules
        run: npm test
      - name: Release and offline asset integrity
        run: npm run check:release
      - name: Install isolated test browser
        run: npx playwright install --with-deps chromium
      - name: Mobile browser regression
        run: npm run test:ui
